<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta
    name="description"
    content="Submit a product review for WDD 131 by rating a product, selecting useful features, and sharing your experience."
>
    <meta name="author" content="Israel López">

    <title>Product Review</title>

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>

        <form method="get" action="review.html">

            <div class="form-group">
                <label for="product">
                    Product Name
                </label>

                <select
                    id="product"
                    name="product"
                    required
                >
                    <option value="" disabled selected>
                        Select a Product ...
                    </option>
                </select>
            </div>


            <fieldset>
                <legend>
                    Overall Rating
                </legend>

                <div class="rating-options">

                    <label for="rating1">
                        1
                        <span>&star;</span>
                    </label>
                    <input
                        type="radio"
                        id="rating1"
                        name="rating"
                        value="1"
                        required
                    >

                    <label for="rating2">
                        2
                        <span>&star;&star;</span>
                    </label>
                    <input
                        type="radio"
                        id="rating2"
                        name="rating"
                        value="2"
                        required
                    >

                    <label for="rating3">
                        3
                        <span>&star;&star;&star;</span>
                    </label>
                    <input
                        type="radio"
                        id="rating3"
                        name="rating"
                        value="3"
                        required
                    >

                    <label for="rating4">
                        4
                        <span>&star;&star;&star;&star;</span>
                    </label>
                    <input
                        type="radio"
                        id="rating4"
                        name="rating"
                        value="4"
                        required
                    >

                    <label for="rating5">
                        5
                        <span>&star;&star;&star;&star;&star;</span>
                    </label>
                    <input
                        type="radio"
                        id="rating5"
                        name="rating"
                        value="5"
                        required
                    >

                </div>
            </fieldset>


            <div class="form-group">
                <label for="installation-date">
                    Date of Installation
                </label>

                <input
                    type="date"
                    id="installation-date"
                    name="installation-date"
                    required
                >
            </div>


            <fieldset>
                <legend>
                    Useful Features
                </legend>

                <p class="instruction">
                    Check all that apply.
                </p>

                <div class="checkbox-group">

                    <label for="feature-durability">
                        <input
                            type="checkbox"
                            id="feature-durability"
                            name="features"
                            value="durability"
                        >
                        Durability
                    </label>

                    <label for="feature-ease">
                        <input
                            type="checkbox"
                            id="feature-ease"
                            name="features"
                            value="ease-of-use"
                        >
                        Ease of Use
                    </label>

                    <label for="feature-performance">
                        <input
                            type="checkbox"
                            id="feature-performance"
                            name="features"
                            value="performance"
                        >
                        Performance
                    </label>

                    <label for="feature-design">
                        <input
                            type="checkbox"
                            id="feature-design"
                            name="features"
                            value="design"
                        >
                        Design
                    </label>

                </div>
            </fieldset>


            <div class="form-group">
                <label for="review">
                    Written Review
                    <span class="optional">(Optional)</span>
                </label>

                <textarea
                    id="review"
                    name="review"
                    rows="6"
                ></textarea>
            </div>


            <div class="form-group">
                <label for="username">
                    Your Name
                    <span class="optional">(Optional)</span>
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                >
            </div>


            <input
                type="submit"
                value="Submit Product Review"
                class="submit-button"
            >

        </form>

    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span>
            | Israel López | Colombia
        </p>

        <p id="lastModified"></p>
    </footer>

</body>
</html>
